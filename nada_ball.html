<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>灘チャレンジ 景品ボールあて</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; background: #0e1422;
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    color: #eef3ff; overscroll-behavior: none;
  }
  body { display: flex; align-items: center; justify-content: center; padding: 12px; }
  .wrap {
    width: min(540px, 96vw, calc((100vh - 130px) * 0.795));
    display: flex; flex-direction: column; gap: 10px;
  }
  .hud { display: flex; justify-content: space-between; gap: 8px; }
  .stat {
    flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.09);
    border-radius: 12px; padding: 8px 10px; text-align: center;
  }
  .stat .label { font-size: 11px; letter-spacing: 0.08em; color: #aebfe0; margin-bottom: 2px; }
  .stat .value { font-size: 22px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
  .stat .value small { font-size: 13px; font-weight: 400; color: #aebfe0; }
  .stage {
    position: relative; width: 100%; aspect-ratio: 620 / 780;
    border-radius: 16px; overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,0.55);
    touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    background: rgba(8,12,24,0.86); backdrop-filter: blur(3px); padding: 28px; gap: 14px;
  }
  .overlay.hidden { display: none; }
  .overlay h1 { font-size: 27px; font-weight: 700; }
  .overlay h2 { font-size: 21px; font-weight: 600; }
  .overlay p { font-size: 14px; line-height: 1.7; color: #dbe3f2; max-width: 350px; }
  .timeofday { font-size: 13px; color: #7fb0ff; font-weight: 600; }
  .big-score { font-size: 52px; font-weight: 700; line-height: 1; color: #7fb0ff; font-variant-numeric: tabular-nums; }
  .sub-result { font-size: 14px; color: #dbe3f2; }
  .new-best { font-size: 13px; color: #6ee0b0; font-weight: 600; letter-spacing: 0.04em; }
  .btn {
    margin-top: 6px; border: none; cursor: pointer;
    background: #2a6df0; color: #fff; font-size: 16px; font-weight: 700;
    padding: 13px 34px; border-radius: 999px; font-family: inherit; transition: transform 0.08s ease;
  }
  .btn:active { transform: scale(0.96); }
  .hint { text-align: center; font-size: 12px; color: #8fa0c4; min-height: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div class="stat"><div class="label">スコア</div><div class="value" id="score">0</div></div>
    <div class="stat"><div class="label">のこり</div><div class="value"><span id="balls">10</span><small>球</small></div></div>
    <div class="stat"><div class="label">ベスト</div><div class="value" id="best">0</div></div>
  </div>
  <div class="stage">
    <canvas id="game"></canvas>
    <div class="overlay" id="startOverlay">
      <h1>景品ボールあて</h1>
      <div class="timeofday" id="todLabel"></div>
      <p>ボールを<b>引っぱって、矢印のむき</b>をきめる。<br>はなすと、その方向へ<b>まっすぐ飛ぶ！</b><br>たまは <b>景品の数だけ</b>。ぜんぶ当てたら満点！<br>おくほどレア＝高とくてん。<br>一番おくの <b>ダイヤモンド</b> は うごくよ！</p>
      <button class="btn" id="startBtn">はじめる</button>
    </div>
    <div class="overlay hidden" id="resultOverlay">
      <h2>おわり！</h2>
      <div class="big-score" id="finalScore">0</div>
      <div class="sub-result" id="knockResult">とった景品：0</div>
      <div class="new-best hidden" id="newBest">★ ベストこうしん！</div>
      <button class="btn" id="retryBtn">もういちど</button>
    </div>
  </div>
  <div class="hint" id="hint">ボールを引っぱって、ねらいを定めよう</div>
</div>

<script>
(function () {
  "use strict";
  const PI2 = Math.PI * 2;

  // ===== 基本 =====
  const W = 620, H = 780;
  const TOTAL_BALLS = 10;
  const BALL_R = 18;
  const START = { x: W / 2, y: H - 70 };
  const MIN_PULL = 14;
  const SPEED = 22;            // 威力は一定（方向だけ自分で決める）
  const COBALT = "#123fa8";

  const TOWN_BASE = 120;       // 上空の遠景スカイライン
  const BOOTH_TOP = 128, BOOTH_BOT = 458;
  const FLOOR_BOT = 470;       // ここから下は公園

  // 棚（上=奥/高レア, 下=手前/低レア）。各段はプールからランダムで景品が出る。
  const SHELVES = [
    { y: 430, pts: 10, r: 30, nmin: 2, nmax: 3, pool: ["bear", "bunny", "cat", "duck"] },
    { y: 332, pts: 20, r: 26, nmin: 2, nmax: 3, pool: ["car", "robot", "ball", "flower"] },
    { y: 236, pts: 30, r: 23, nmin: 1, nmax: 2, pool: ["crown", "cake", "heart", "star"] },
    { y: 144, pts: 50, r: 20, nmin: 1, nmax: 2, pool: ["diamond", "ring"] },
  ];

  // ===== 時間帯 =====
  function getTimePhase() {
    const h = new Date().getHours();
    if (h >= 5 && h < 10) return "morning";
    if (h >= 10 && h < 16) return "day";
    if (h >= 16 && h < 19) return "evening";
    return "night";
  }
  const TOD = getTimePhase();
  const TOD_LABEL = { morning: "あさ", day: "ひるま", evening: "ゆうがた", night: "よる" }[TOD];
  const PALETTE = {
    morning: { skyTop: "#ffd9a8", skyBot: "#bfe0f5", town: "#9aa6b8", townLit: false },
    day:     { skyTop: "#7ec0ee", skyBot: "#cfe9ff", town: "#8794a8", townLit: false },
    evening: { skyTop: "#b85a8a", skyBot: "#ffb066", town: "#5b5168", townLit: true },
    night:   { skyTop: "#0c1430", skyBot: "#22305a", town: "#2a3048", townLit: true },
  }[TOD];

  const BUILDINGS = [[16,36,30],[60,30,42],[150,40,26],[430,38,34],[484,32,46],[538,42,30],[586,28,38]];
  const TOWER = { cx: 56, topY: 44, baseHW: 18, waistHW: 6, topHW: 12 };

  // ===== キャンバス =====
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  function resize() {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  }
  window.addEventListener("resize", resize);

  // ===== 状態 =====
  let state = "start";
  let targets = [], particles = [], stars = [], townWindows = [];
  let score = 0, ballsLeft = TOTAL_BALLS, gotCount = 0, streak = 0;
  let dragPos = null, flyer = null;
  let rings = [];
  let tFrame = 0, memBest = 0;

  const el = {
    score: document.getElementById("score"), balls: document.getElementById("balls"),
    best: document.getElementById("best"), hint: document.getElementById("hint"),
    startOverlay: document.getElementById("startOverlay"), resultOverlay: document.getElementById("resultOverlay"),
    finalScore: document.getElementById("finalScore"), knockResult: document.getElementById("knockResult"),
    newBest: document.getElementById("newBest"), todLabel: document.getElementById("todLabel"),
  };
  function loadBest() { try { return parseInt(localStorage.getItem("nada_keihin_best")) || 0; } catch (e) { return memBest; } }
  function saveBest(v) { memBest = v; try { localStorage.setItem("nada_keihin_best", v); } catch (e) {} }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  // ===== 景品をランダム配置 =====
  function buildTargets() {
    const list = [];
    for (const s of SHELVES) {
      const n = Math.floor(rand(s.nmin, s.nmax + 0.999));
      const xs = [];
      for (let i = 0; i < n; i++) {
        let x, tries = 0;
        do { x = rand(80, W - 80); tries++; }
        while (xs.some(px => Math.abs(px - x) < 130) && tries < 25);
        xs.push(x);
        const moving = s.pts >= 50;     // 一番おく＝動く難しいやつ
        list.push({
          x, baseX: x, y: s.y + rand(-8, 8), r: s.r * rand(0.85, 1.16),
          kind: pick(s.pool), points: s.pts,
          down: false, fall: 0, alpha: 1, bob: rand(0, 6),
          moving, amp: moving ? rand(58, 82) : 0, phase: rand(0, 6), spd: 0.035,
        });
      }
    }
    return list;
  }

  // 一直線で最初に当たる景品を返す（照準予測＆通路保証で共用）
  function lineFirstHit(dx, dy, list) {
    let x = START.x, y = START.y;
    for (let i = 0; i < 500; i++) {
      x += dx * 6; y += dy * 6;
      if (y < TOWN_BASE - 16 || x < -30 || x > W + 30) return null;
      const sc = ballScale(y);
      for (const t of list) { if (t.down) continue; if (Math.hypot(x - t.x, y - t.y) < t.r * 0.82 + BALL_R * sc) return t; }
    }
    return null;
  }
  // 一番奥（ダイヤ段）に届く角度が最低1本あるか
  function topReachable(list) {
    for (let deg = -38; deg <= 38; deg += 1) {
      const a = (-90 + deg) * Math.PI / 180;
      const hit = lineFirstHit(Math.cos(a), Math.sin(a), list);
      if (hit === null || hit.points >= 50) return true;
    }
    return false;
  }
  function makeTargets() {
    let list;
    for (let tries = 0; tries < 40; tries++) { list = buildTargets(); if (topReachable(list)) return list; }
    return list;
  }

  function resetGame() {
    targets = makeTargets();
    score = 0; ballsLeft = targets.length; gotCount = 0; streak = 0;
    dragPos = null; flyer = null; particles = []; rings = [];
    state = "idle"; updateHud();
    el.hint.textContent = "ぜんぶ当てたら満点！ねらって放とう";
  }
  function updateHud() { el.score.textContent = score; el.balls.textContent = ballsLeft; el.best.textContent = loadBest(); }

  // ===== 入力（モンスト式：球は動かず、引いた逆向きへ。威力は一定）=====
  function pointerLogical(e) {
    const rect = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    return { x: cx / rect.width * W, y: cy / rect.height * H };
  }
  function onDown(e) {
    if (state !== "idle") return;
    const p = pointerLogical(e);
    if (Math.hypot(p.x - START.x, p.y - START.y) > BALL_R * 5) return;
    e.preventDefault();
    state = "aiming"; dragPos = { x: p.x, y: p.y };
  }
  function onMove(e) {
    if (state !== "aiming") return;
    e.preventDefault(); dragPos = pointerLogical(e);
  }
  function aimDir() {
    const px = dragPos.x - START.x, py = dragPos.y - START.y;
    const pmag = Math.hypot(px, py);
    let dx = -px, dy = -py;
    const dmag = Math.hypot(dx, dy) || 1;
    dx /= dmag; dy /= dmag;
    const valid = dy < -0.05 && pmag > MIN_PULL;
    return { dx, dy, valid };
  }
  function onUp(e) {
    if (state !== "aiming") return;
    e.preventDefault();
    const a = aimDir();
    if (!a.valid) { state = "idle"; dragPos = null; return; }
    flyer = { x: START.x, y: START.y, vx: a.dx * SPEED, vy: a.dy * SPEED, trail: [] };
    dragPos = null; state = "flying"; el.hint.textContent = "";
  }
  canvas.addEventListener("mousedown", onDown);
  window.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onUp);
  canvas.addEventListener("touchstart", onDown, { passive: false });
  canvas.addEventListener("touchmove", onMove, { passive: false });
  canvas.addEventListener("touchend", onUp, { passive: false });

  // ===== 進行 =====
  function ballScale(y) {
    const top = TOWN_BASE, bot = START.y;
    let f = (y - top) / (bot - top); f = Math.max(0, Math.min(1, f));
    return 0.6 + 0.4 * f;
  }
  function spawnParticles(x, y, color, n, sc) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * PI2, s = (Math.random() * 4 + 1) * (sc || 1);
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, life: 1, color });
    }
  }
  function endBall() {
    flyer = null; ballsLeft--; updateHud();
    if (ballsLeft <= 0) setTimeout(gameOver, 600);
    else { state = "idle"; el.hint.textContent = "ボールを引っぱって、ねらいを定めよう"; }
  }
  function flyerHitCheck() {
    const sc = ballScale(flyer.y);
    for (const t of targets) {
      if (t.down) continue;
      const d = Math.hypot(flyer.x - t.x, flyer.y - t.y);
      if (d < t.r * 0.82 + BALL_R * sc) return t;
    }
    return null;
  }
  function ringColor(kind) {
    if (kind === "diamond" || kind === "ring") return "#bdf0ff";
    if (kind === "heart") return "#ff7aa0";
    if (kind === "flower") return "#ff8ec2";
    if (kind === "star" || kind === "crown" || kind === "cake") return "#ffd23a";
    return "#ffd56a";
  }
  function spawnRing(x, y, color) { rings.push({ x, y, r: 8, maxR: 66, life: 1, color }); }
  function resolveHit(t) {
    t.down = true; t.fall = 0.001;
    t.fdir = flyer.x >= t.x ? 1 : -1;
    streak++;
    const bonus = (streak - 1) * 3;
    gotCount++; score += t.points + bonus;
    const col = ringColor(t.kind);
    spawnParticles(t.x, t.y, col, 22, 1.0);
    spawnRing(t.x, t.y, col);
    updateHud();
    el.hint.textContent = "+" + t.points + (bonus > 0 ? "  +" + bonus + " れんさ!" : "！");
    state = "flying-done"; setTimeout(endBall, 420);
  }
  function missBall() { streak = 0; el.hint.textContent = "おしい！"; state = "flying-done"; setTimeout(endBall, 300); }

  function update() {
    tFrame++;
    for (const t of targets) {
      if (t.moving && !t.down) {
        t.x = Math.max(70, Math.min(W - 70, t.baseX + Math.sin(tFrame * t.spd + t.phase) * t.amp));
      }
      if (t.down && t.fall < 1) { t.fall += 0.06; if (t.fall > 0.7) t.alpha -= 0.05; if (t.alpha < 0) t.alpha = 0; }
    }
    if (state === "flying" && flyer) {
      const sub = 3;
      for (let s = 0; s < sub; s++) {
        flyer.x += flyer.vx / sub; flyer.y += flyer.vy / sub;
        const hit = flyerHitCheck();
        if (hit) { resolveHit(hit); break; }
        if (flyer.y < TOWN_BASE - 16 || flyer.x < -30 || flyer.x > W + 30) { missBall(); break; }
      }
      if (flyer) { flyer.trail.push({ x: flyer.x, y: flyer.y }); if (flyer.trail.length > 9) flyer.trail.shift(); }
    }
    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.18; p.life -= 0.025; }
    particles = particles.filter(p => p.life > 0);
    for (const rg of rings) { rg.r += (rg.maxR - rg.r) * 0.16; rg.life -= 0.045; }
    rings = rings.filter(rg => rg.life > 0);
  }

  function gameOver() {
    state = "over";
    const best = loadBest(); let isNew = false;
    if (score > best) { saveBest(score); isNew = true; }
    el.finalScore.textContent = score;
    el.knockResult.textContent = (gotCount === targets.length ? "★満点★ " : "") + "とった景品：" + gotCount + " / " + targets.length;
    el.newBest.classList.toggle("hidden", !isNew);
    el.resultOverlay.classList.remove("hidden");
    updateHud();
  }

  // ===== 描画 =====
  function draw() {
    ctx.fillStyle = "#0d1322"; ctx.fillRect(0, 0, W, H);
    drawSky(); drawTown(); drawPortTower();
    drawBoothBack(); drawShelves();
    const sorted = targets.slice().sort((a, b) => a.y - b.y);
    for (const t of sorted) drawPrize(t);
    if (flyer) drawFlyer();
    for (const p of particles) {
      ctx.globalAlpha = Math.max(p.life, 0); ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, 2.4 * p.life + 0.6, 0, PI2); ctx.fill();
    }
    for (const rg of rings) {
      ctx.globalAlpha = Math.max(rg.life, 0); ctx.strokeStyle = rg.color; ctx.lineWidth = 3 * rg.life + 1;
      ctx.beginPath(); ctx.arc(rg.x, rg.y, rg.r, 0, PI2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    drawForeground();
    if (state === "aiming" && dragPos) drawAimPreview();
    drawHandBall();
    drawTopDecor();
  }

  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, FLOOR_BOT);
    g.addColorStop(0, PALETTE.skyTop); g.addColorStop(1, PALETTE.skyBot);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, FLOOR_BOT);
    if (TOD === "night") {
      for (const s of stars) {
        const tw = 0.5 + 0.5 * Math.sin(tFrame * 0.05 + s.tw);
        ctx.globalAlpha = 0.3 + tw * 0.5; ctx.fillStyle = "#cfe0ff";
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, PI2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  function drawTown() {
    ctx.fillStyle = PALETTE.town;
    for (const b of BUILDINGS) ctx.fillRect(b[0], TOWN_BASE - b[2], b[1], b[2] + 12);
    if (PALETTE.townLit) {
      for (const w of townWindows) {
        ctx.globalAlpha = 0.7 + 0.3 * Math.sin(tFrame * 0.04 + w.p);
        ctx.fillStyle = TOD === "evening" ? "#ffd07a" : "#ffe49a";
        ctx.fillRect(w.x, w.y, 3, 3);
      }
      ctx.globalAlpha = 1;
    }
  }

  function drawPortTower() {
    const cx = TOWER.cx, topY = TOWER.topY, baseY = TOWN_BASE;
    const h = baseY - topY;
    const baseHW = TOWER.baseHW, waistHW = TOWER.waistHW, topHW = TOWER.topHW;
    const waistY = topY + h * 0.52;
    const lit = PALETTE.townLit;
    const red = lit ? "#ff3b2e" : "#c0392b";
    ctx.save();
    if (lit) {
      ctx.globalAlpha = 0.16 + 0.05 * Math.sin(tFrame * 0.05);
      const gg = ctx.createRadialGradient(cx, (topY + baseY) / 2, 4, cx, (topY + baseY) / 2, 60);
      gg.addColorStop(0, "#ff6a3a"); gg.addColorStop(1, "rgba(255,106,58,0)");
      ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(cx, (topY + baseY) / 2, 60, 0, PI2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    function ep(sign, p) {
      const x0 = cx + sign * baseHW, y0 = baseY, x1 = cx + sign * waistHW, y1 = waistY, x2 = cx + sign * topHW, y2 = topY;
      const u = 1 - p; return { x: u*u*x0 + 2*u*p*x1 + p*p*x2, y: u*u*y0 + 2*u*p*y1 + p*p*y2 };
    }
    ctx.strokeStyle = red; ctx.lineWidth = 2.4; ctx.lineJoin = "round";
    for (const sign of [-1, 1]) { ctx.beginPath(); const a = ep(sign, 0); ctx.moveTo(a.x, a.y); ctx.quadraticCurveTo(cx + sign*waistHW, waistY, cx + sign*topHW, topY); ctx.stroke(); }
    ctx.lineWidth = 1; ctx.strokeStyle = lit ? "rgba(255,130,95,0.9)" : "rgba(192,57,43,0.6)";
    const N = 7;
    for (let i = 0; i < N; i++) {
      const p1 = i / N, p2 = (i + 1) / N;
      const L1 = ep(-1, p1), R2 = ep(1, p2), R1 = ep(1, p1), L2 = ep(-1, p2);
      ctx.beginPath(); ctx.moveTo(L1.x, L1.y); ctx.lineTo(R2.x, R2.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(R1.x, R1.y); ctx.lineTo(L2.x, L2.y); ctx.stroke();
    }
    const deckY = topY + h * 0.28;
    ctx.fillStyle = red; roundRect(cx - 11, deckY - 9, 22, 18, 5); ctx.fill();
    ctx.fillStyle = lit ? "#fff2b0" : "#e8c9a0"; for (let i = 0; i < 4; i++) ctx.fillRect(cx - 8 + i * 5, deckY - 2, 3, 5);
    ctx.strokeStyle = red; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(cx, topY); ctx.lineTo(cx, topY - 10); ctx.stroke();
    if (lit) { ctx.globalAlpha = 0.5 + 0.5 * Math.sin(tFrame * 0.12); ctx.fillStyle = "#ffe07a"; ctx.beginPath(); ctx.arc(cx, topY - 11, 2.2, 0, PI2); ctx.fill(); ctx.globalAlpha = 1; }
    ctx.restore();
  }

  // 屋台の中（棚の背板）
  function drawBoothBack() {
    ctx.save();
    roundRect(18, BOOTH_TOP, W - 36, BOOTH_BOT - BOOTH_TOP, 14); ctx.clip();
    const g = ctx.createLinearGradient(0, BOOTH_TOP, 0, BOOTH_BOT);
    g.addColorStop(0, "#1b2447"); g.addColorStop(1, "#10172f");
    ctx.fillStyle = g; ctx.fillRect(18, BOOTH_TOP, W - 36, BOOTH_BOT - BOOTH_TOP);
    // 奥(上)ほど暗く＝奥行き
    const sh = ctx.createLinearGradient(0, BOOTH_TOP, 0, BOOTH_BOT);
    sh.addColorStop(0, "rgba(0,0,0,0.5)"); sh.addColorStop(0.55, "rgba(0,0,0,0.12)"); sh.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = sh; ctx.fillRect(18, BOOTH_TOP, W - 36, BOOTH_BOT - BOOTH_TOP);
    ctx.restore();
    ctx.strokeStyle = "rgba(127,160,255,0.18)"; ctx.lineWidth = 2;

  // ===== 照準（モンスト式・一段目までくっきり）=====
  function drawAimPreview() {
    const a = aimDir();

    ctx.strokeStyle = "rgba(255,255,255,0.16)"; ctx.lineWidth = 2; ctx.setLineDash([4, 5]);
    ctx.beginPath(); ctx.moveTo(START.x, START.y); ctx.lineTo(dragPos.x, dragPos.y); ctx.stroke();
    ctx.setLineDash([]);
    if (!a.valid) {
      // 無効（上を向いてない/弱い）：赤い短い矢印
      const ex = START.x + a.dx * 60, ey = START.y + a.dy * 60;
      arrow(START.x, START.y, ex, ey, "rgba(255,120,90,0.7)", 4);
      return;
    }
    // 一段目（手前の棚）までの交点
    const firstY = SHELVES[0].y;
    const t1 = (firstY - START.y) / a.dy;
    const bx = START.x + a.dx * t1, by = firstY;
    // この角度で最初に当たる景品を予測（矢印の色だけに使う）
    const predicted = lineFirstHit(a.dx, a.dy, targets);
    const hitCol = predicted ? "#ffd56a" : "#7fb0ff";
    // くっきりした太い矢印（色＝何かに当たるか／素通りか）
    ctx.save();
    ctx.shadowColor = predicted ? "rgba(255,213,106,0.85)" : "rgba(127,176,255,0.8)"; ctx.shadowBlur = 8;
    arrow(START.x, START.y, bx, by, hitCol, 5);
    ctx.restore();
    // 奥への薄い点線（レーンの続き／当たる景品の手前で止める）
    ctx.fillStyle = hitCol;
    for (let s = 1; s <= 8; s++) {
      const fx = bx + a.dx * (20 * s), fy = by + a.dy * (20 * s);
      if (fy < BOOTH_TOP) break;
      ctx.globalAlpha = 0.4 - s * 0.04;
      ctx.beginPath(); ctx.arc(fx, fy, 3, 0, PI2); ctx.fill();
    }

  }

    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-15, -8); ctx.lineTo(-15, 8); ctx.closePath(); ctx.fill();
    ctx.restore();

  function drawLantern(x, y) {
    const lit = PALETTE.townLit;
    ctx.fillStyle = "#3a2410"; ctx.fillRect(x - 1, y - 20, 2, 7);
    const g = ctx.createRadialGradient(x, y, 2, x, y, 15);
    if (lit) { g.addColorStop(0, "#ffd86a"); g.addColorStop(1, "#d23b2a"); }
    else { g.addColorStop(0, "#e88a6a"); g.addColorStop(1, "#b5321f"); }
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(x, y, 10, 14, 0, 0, PI2); ctx.fill();
    ctx.fillStyle = "#2a1810"; ctx.fillRect(x - 5, y - 13, 10, 2); ctx.fillRect(x - 5, y + 12, 10, 2);
    if (lit) { ctx.globalAlpha = 0.22 + 0.1 * Math.sin(tFrame * 0.06); ctx.fillStyle = "#ffd86a"; ctx.beginPath(); ctx.arc(x, y, 24, 0, PI2); ctx.fill(); ctx.globalAlpha = 1; }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function loop() { update(); draw(); requestAnimationFrame(loop); }

  function makeStars() { const a = []; for (let i = 0; i < 40; i++) a.push({ x: Math.random() * W, y: Math.random() * (TOWN_BASE - 30), r: Math.random() * 1.3 + 0.3, tw: Math.random() * 6 }); return a; }
  function makeWindows() {
    const a = [];
    for (const b of BUILDINGS) for (let yy = TOWN_BASE - b[2] + 5; yy < TOWN_BASE; yy += 9) for (let xx = b[0] + 4; xx < b[0] + b[1] - 4; xx += 8) if (Math.random() < 0.5) a.push({ x: xx, y: yy, p: Math.random() * 6 });
    return a;
  }

  document.getElementById("startBtn").addEventListener("click", function () { el.startOverlay.classList.add("hidden"); resetGame(); });
  document.getElementById("retryBtn").addEventListener("click", function () { el.resultOverlay.classList.add("hidden"); resetGame(); });

  el.todLabel.textContent = "いまは「" + TOD_LABEL + "」の灘チャレンジ";
  stars = makeStars(); townWindows = makeWindows();
  resize(); updateHud(); loop();
})();
</script>
</body>
