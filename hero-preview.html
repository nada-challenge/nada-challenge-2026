<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>【プレビュー】ヒーローの風演出 — 灘チャレンジ2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Noto+Sans+JP:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===== 本番 style.css からヒーロー関連を抜粋（トークンは同一） ===== */
:root {
  --color-paper: #fdfdfb; --color-ink: #16181d; --color-ink-sub: #5a6472;
  --color-cerulean: #2e7cd6; --color-deep-blue: #1b4f9c; --color-navy: #0e2a52;
  --color-teal: #1e8a6e; --color-teal-text: #14705a;
  --color-wash-blue: #eaf2fb; --color-line: #d8e2ee;
  --font-display: "Shippori Mincho", "Hiragino Mincho ProN", serif;
  --font-body: "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
  --font-caption: "Inter", "Noto Sans JP", sans-serif;
  --fs-hero: clamp(2rem, 5vw, 3.6rem);
  --space-2: 0.5rem; --space-3: 1rem; --space-4: 1.5rem; --space-5: 2.5rem; --space-8: 9rem;
  --width-content: 68rem;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-body); color: var(--color-ink); background: var(--color-paper); line-height: 1.9; letter-spacing: .02em; -webkit-font-smoothing: antialiased; }
.container { max-width: var(--width-content); margin-inline: auto; padding-inline: var(--space-4); }
.eyebrow { display:block; font-family: var(--font-caption); font-size: .8rem; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; margin-bottom: var(--space-2); }
.hero { position: relative; min-height: 80vh; display: flex; align-items: center; overflow: hidden; background: var(--color-paper); }
.hero__visual { position: absolute; inset: 0; }
.hero__img { width: 100%; height: 100%; object-fit: cover; object-position: center; opacity: 0; transition: opacity 1.2s var(--ease-out); display: block; }
.is-loaded .hero__img { opacity: 1; }
.hero__inner { position: relative; z-index: 1; width: 100%; padding-block: var(--space-8) var(--space-5); }
.hero__copy .eyebrow, .hero__title, .hero__meta, .hero__countdown { text-shadow: 0 0 10px var(--color-paper), 0 0 22px var(--color-paper), 0 0 34px var(--color-paper); }
.hero__copy .eyebrow { color: var(--color-navy); }
.hero__copy > * { opacity: 0; transform: translateY(1.25rem); transition: opacity .9s var(--ease-out), transform .9s var(--ease-out); }
.is-loaded .hero__copy > *:nth-child(1) { transition-delay: .3s; }
.is-loaded .hero__copy > *:nth-child(2) { transition-delay: .6s; }
.is-loaded .hero__copy > *:nth-child(3) { transition-delay: .9s; }
.is-loaded .hero__copy > *:nth-child(4) { transition-delay: 1.1s; }
.is-loaded .hero__copy > * { opacity: 1; transform: translateY(0); }
.hero__title { font-family: var(--font-display); font-size: var(--fs-hero); font-weight: 600; line-height: 1.5; letter-spacing: .08em; color: var(--color-navy); max-width: 22ch; }
.hero__meta { display: flex; align-items: center; gap: var(--space-3); margin-top: var(--space-4); font-family: var(--font-caption); font-size: .9rem; letter-spacing: .12em; color: var(--color-ink-sub); }
.hero__date { color: var(--color-teal-text); font-weight: 500; }
.hero__meta-sep { width: 2rem; height: 1px; background: var(--color-line); }
/* ===== 今回追加分 ===== */
.hero__countdown { margin-top: var(--space-3); font-family: var(--font-caption); font-size: .85rem; letter-spacing: .14em; color: var(--color-teal-text); }
.hero__wind { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.wind-gust { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 90; }
.preview-note { padding: var(--space-5) var(--space-4); max-width: 42rem; margin-inline: auto; color: var(--color-ink-sub); font-size: .9rem; }
@media (max-width: 768px) {
  .hero { min-height: 0; display: block; }
  .hero__visual { position: relative; aspect-ratio: 16 / 10; }
  .hero__img { object-position: 65% center; }
  .hero__inner { padding-block: var(--space-5); }
}
@media (prefers-reduced-motion: reduce) {
  .hero__img, .hero__copy > * { opacity: 1 !important; transform: none !important; transition: none !important; }
}
</style>
</head>
<body data-wind-gust>

<section class="hero" data-wind>
  <div class="hero__visual" aria-hidden="true">
    <picture>
      <source type="image/webp" srcset="https://nada-challenge.github.io/nada-challenge-2026/img/key_visual-1280.webp">
      <img src="https://nada-challenge.github.io/nada-challenge-2026/img/key_visual.jpg" alt="" class="hero__img" fetchpriority="high" decoding="async">
    </picture>
  </div>
  <div class="container hero__inner">
    <div class="hero__copy">
      <p class="eyebrow">NADA CHALLENGE 2026</p>
      <h1 class="hero__title">ともに響き合う<br>灘の心と未来の風</h1>
      <p class="hero__meta">
        <span class="hero__date">2026.9.20 SUN 11:00–16:00</span>
        <span class="hero__meta-sep" aria-hidden="true"></span>
        <span>都賀川公園</span>
      </p>
      <p class="hero__countdown" data-countdown hidden></p>
    </div>
  </div>
</section>

<p class="preview-note">
  ▲ プレビュー：左→右へ流れる細い流線（風）と、ポインタに連動した数pxのパララックスを確認できます。
  ページ内の好きな場所をクリック／タップすると、その地点から短い流線が「ひと吹き」流れます。
  OSの「視差効果を減らす」設定が有効な場合は、すべて静止します。
</p>

<script>
/* 本番 js/main.js のモジュール 1・9・10・11 と同一ロジック（プレビュー用に抜粋） */
(function () {
  'use strict';
  var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* 1. ヒーロー読み込み演出 */
  (function () {
    var heroImg = document.querySelector('.hero__img');
    var reveal = function () { document.body.classList.add('is-loaded'); };
    if (!heroImg || prefersReduced) { reveal(); return; }
    if (heroImg.complete) { reveal(); }
    else {
      heroImg.addEventListener('load', reveal);
      heroImg.addEventListener('error', reveal);
      window.setTimeout(reveal, 1800);
    }
  })();

  /* 9. 開催日カウントダウン */
  (function () {
    var el = document.querySelector('[data-countdown]');
    if (!el) return;
    var START = new Date('2026-09-20T11:00:00+09:00');
    var END = new Date('2026-09-20T16:00:00+09:00');
    var DAY_MS = 24 * 60 * 60 * 1000;
    var now = new Date();
    var text;
    if (now < START) {
      var days = Math.ceil((START - now) / DAY_MS);
      text = (days === 1) ? 'いよいよ明日開催' : '開催まで あと' + days + '日';
    } else if (now <= END) {
      text = '本日開催中（16:00まで）';
    } else {
      text = '灘チャレンジ2026は終了しました。ご来場ありがとうございました';
    }
    el.textContent = text;
    el.hidden = false;
  })();

  /* 10. ヒーローの風演出 ＋ 軽いパララックス */
  (function () {
    var hero = document.querySelector('.hero[data-wind]');
    if (!hero || prefersReduced) return;
    var visual = hero.querySelector('.hero__visual');
    var heroImg = hero.querySelector('.hero__img');
    if (!visual) return;

    var canvas = document.createElement('canvas');
    canvas.className = 'hero__wind';
    canvas.setAttribute('aria-hidden', 'true');
    visual.insertAdjacentElement('afterend', canvas);
    var ctx = canvas.getContext('2d');

    var rootStyle = getComputedStyle(document.documentElement);
    var hexToRgba = function (hex, alpha) {
      var h = hex.trim().replace('#', '');
      return 'rgba(' + parseInt(h.substring(0,2),16) + ',' + parseInt(h.substring(2,4),16) + ',' + parseInt(h.substring(4,6),16) + ',' + alpha + ')';
    };
    var COLORS = [
      rootStyle.getPropertyValue('--color-cerulean') || '#2e7cd6',
      rootStyle.getPropertyValue('--color-deep-blue') || '#1b4f9c',
      rootStyle.getPropertyValue('--color-teal') || '#1e8a6e'
    ];

    var W = 0, H = 0, DPR = 1;
    var wisps = [];
    var rafId = null, running = false, inView = true;
    var isTouch = window.matchMedia('(hover: none)').matches;
    var targetX = 0, targetY = 0, curX = 0, curY = 0;
    var PARALLAX_PX = 6;

    var resize = function () {
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      W = hero.clientWidth; H = hero.clientHeight;
      canvas.width = W * DPR; canvas.height = H * DPR;
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    };

    var WISP_COUNT = window.innerWidth < 768 ? 5 : 8;
    var newWisp = function (anywhere) {
      var len = 90 + Math.random() * 140;
      return {
        x: anywhere ? Math.random() * W : -len,
        y: H * (0.12 + Math.random() * 0.76),
        len: len,
        speed: 0.35 + Math.random() * 0.5,
        amp: 4 + Math.random() * 9,
        k: 0.004 + Math.random() * 0.006,
        phase: Math.random() * Math.PI * 2,
        width: 0.8 + Math.random() * 0.7,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        alpha: 0.10 + Math.random() * 0.14
      };
    };
    var initWisps = function () {
      wisps = [];
      for (var i = 0; i < WISP_COUNT; i++) wisps.push(newWisp(true));
    };

    var time = 0;
    var draw = function () {
      ctx.clearRect(0, 0, W, H);
      time += 0.016;
      if (isTouch) {
        targetX = Math.sin(time * 0.25) * (PARALLAX_PX * 0.6);
        targetY = Math.cos(time * 0.2) * (PARALLAX_PX * 0.4);
      }
      curX += (targetX - curX) * 0.05;
      curY += (targetY - curY) * 0.05;
      if (heroImg) {
        heroImg.style.transform = 'translate(' + curX.toFixed(2) + 'px,' + curY.toFixed(2) + 'px) scale(1.02)';
      }
      ctx.save();
      ctx.translate(curX * 1.6, curY * 1.6);
      for (var i = 0; i < wisps.length; i++) {
        var w = wisps[i];
        w.x += w.speed;
        var edge = Math.min(1, (w.x + w.len) / 120, (W + w.len - w.x) / 160);
        if (edge < 0) edge = 0;
        ctx.beginPath();
        var STEP = 14;
        for (var t = 0; t <= w.len; t += STEP) {
          var px = w.x - t;
          var py = w.y + Math.sin(px * w.k + w.phase + time * 0.6) * w.amp;
          if (t === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.strokeStyle = hexToRgba(w.color, w.alpha * edge);
        ctx.lineWidth = w.width;
        ctx.lineCap = 'round';
        ctx.stroke();
        if (w.x - w.len > W + 40) wisps[i] = newWisp(false);
      }
      ctx.restore();
      rafId = running ? requestAnimationFrame(draw) : null;
    };

    var updateRunning = function () {
      var shouldRun = inView && !document.hidden;
      if (shouldRun && !running) { running = true; rafId = requestAnimationFrame(draw); }
      else if (!shouldRun && running) { running = false; if (rafId) cancelAnimationFrame(rafId); rafId = null; }
    };
    document.addEventListener('visibilitychange', updateRunning);
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (entries) {
        inView = entries[0].isIntersecting;
        updateRunning();
      }, { threshold: 0 }).observe(hero);
    }
    if (!isTouch) {
      var pending = false;
      hero.addEventListener('pointermove', function (e) {
        if (pending) return;
        pending = true;
        requestAnimationFrame(function () {
          var rect = hero.getBoundingClientRect();
          targetX = ((e.clientX - rect.left) / rect.width - 0.5) * -PARALLAX_PX * 2;
          targetY = ((e.clientY - rect.top) / rect.height - 0.5) * -PARALLAX_PX;
          pending = false;
        });
      });
      hero.addEventListener('pointerleave', function () { targetX = 0; targetY = 0; });
    }
    var resizePending = false;
    window.addEventListener('resize', function () {
      if (resizePending) return;
      resizePending = true;
      requestAnimationFrame(function () { resize(); resizePending = false; });
    });
    resize();
    initWisps();
    updateRunning();
  })();

  /* 11. タップ／クリック時の風（ひと吹き） */
  (function () {
    if (prefersReduced) return;
    if (!document.body.hasAttribute('data-wind-gust')) return;
    var canvas = null, ctx = null, particles = [], rafId = null;
    var rootStyle = getComputedStyle(document.documentElement);
    var cerulean = (rootStyle.getPropertyValue('--color-cerulean') || '#2e7cd6').trim();
    var teal = (rootStyle.getPropertyValue('--color-teal') || '#1e8a6e').trim();
    var hexToRgba = function (hex, alpha) {
      var h = hex.replace('#', '');
      return 'rgba(' + parseInt(h.substring(0,2),16) + ',' + parseInt(h.substring(2,4),16) + ',' + parseInt(h.substring(4,6),16) + ',' + alpha + ')';
    };
    var ensureCanvas = function () {
      if (canvas) return;
      canvas = document.createElement('canvas');
      canvas.className = 'wind-gust';
      canvas.setAttribute('aria-hidden', 'true');
      document.body.appendChild(canvas);
      ctx = canvas.getContext('2d');
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    var removeCanvas = function () {
      if (!canvas) return;
      canvas.remove(); canvas = null; ctx = null;
    };
    var tick = function () {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      var alive = false;
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        p.t += 0.03;
        if (p.t >= 1) continue;
        alive = true;
        p.x += p.vx; p.y += p.vy;
        var fade = 1 - p.t;
        ctx.beginPath();
        ctx.moveTo(p.x - p.len, p.y + Math.sin(p.x * 0.05) * 2);
        ctx.quadraticCurveTo(p.x - p.len * 0.5, p.y - 3, p.x, p.y);
        ctx.strokeStyle = hexToRgba(p.color, 0.35 * fade);
        ctx.lineWidth = 1;
        ctx.lineCap = 'round';
        ctx.stroke();
      }
      if (alive) { rafId = requestAnimationFrame(tick); }
      else { particles = []; rafId = null; removeCanvas(); }
    };
    document.addEventListener('click', function (e) {
      ensureCanvas();
      var count = 3 + Math.floor(Math.random() * 2);
      for (var i = 0; i < count; i++) {
        particles.push({
          x: e.clientX,
          y: e.clientY + (Math.random() - 0.5) * 18,
          vx: 1.6 + Math.random() * 1.8,
          vy: (Math.random() - 0.5) * 0.6,
          len: 18 + Math.random() * 26,
          t: 0,
          color: Math.random() < 0.7 ? cerulean : teal
        });
      }
      if (!rafId) rafId = requestAnimationFrame(tick);
    });
  })();
})();
</script>
</body>
</html>
